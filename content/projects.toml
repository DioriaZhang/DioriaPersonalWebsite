[[items]]
title = "EarthMamba"
subtitle = "High-Resolution Remote Sensing Vision Foundation Model"
date = "2025 – 2026"
content = """
An end-to-end vision foundation model for high-resolution remote sensing: architecture design, pretraining data construction, distributed training, downstream transfer, and ablation analysis.

- **Architecture:** ARMG, SparseSSM, and Latent Graph modules that address spatial discontinuity, small-object feature dilution, and recursive noise accumulation in vision Mamba.
- **Pretraining data:** ~3.67M high-resolution remote sensing images for MAE self-supervised pretraining, with KMeans-based distribution control and leakage checks.
- **Training:** Mamba3 Triton kernels, BF16, DDP / FSDP, gradient checkpointing, Fused AdamW.
- **Results:** 78.41% macro-mAP (DFC15), 77.38% mIoU (INRIA), 68.06% mIoU (SECOND).

[View on GitHub](https://github.com/DioriaZhang/earth-mamba)
"""
tags = ["PyTorch", "Mamba", "Remote Sensing", "Foundation Model"]

[[items]]
title = "Multilingual Speech & Language Models"
subtitle = "AI Algorithm Engineer Intern · BYD"
date = "2026"
content = """
Built large-scale multilingual speech data pipelines and trained speech & language models for ASR, S2TT, Chat, and SLU.

- **Speech synthesis:** ~6.5M utterances per language across 8 languages with CosyVoice3; multi-GPU streaming and resumable processing.
- **Whisper fine-tuning:** full-parameter fine-tuning of Whisper-large-v3 with DeepSpeed ZeRO Stage 2, BF16, and SpecAug.
- **SLU:** Whisper Encoder + Adapter + Qwen3-8B with staged training and LoRA.
- **Evaluation:** CER/WER tiered filtering and a unified ASR / S2TT / general-capability benchmark (COMET, LLM-as-a-Judge, MGSM, MMLU).
"""
tags = ["ASR", "TTS", "LLM", "DeepSpeed"]
