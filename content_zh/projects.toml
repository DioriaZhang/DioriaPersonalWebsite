[[items]]
title = "EarthMamba"
subtitle = "高分辨率遥感视觉基础模型"
date = "2025 – 2026"
content = """
面向高分辨率遥感的全流程视觉基础模型：从模型设计、预训练数据构建、分布式训练，到下游迁移与消融分析。

- **模型架构：** 设计 ARMG、SparseSSM 与 Latent Graph 三类模块，分别缓解视觉 Mamba 中的空间连续性破坏、小目标特征稀释与递归噪声累积问题。
- **预训练数据：** 构建约 367 万张高分辨率遥感图像的 MAE 自监督预训练集，结合 KMeans 聚类控制数据分布并规避泄露。
- **训练：** Mamba3 Triton 序列计算、BF16、DDP / FSDP、梯度检查点、Fused AdamW。
- **结果：** DFC15 78.41% macro-mAP，INRIA 77.38% mIoU，SECOND 68.06% mIoU。

[在 GitHub 上查看](https://github.com/DioriaZhang/earth-mamba)
"""
tags = ["PyTorch", "Mamba", "遥感", "基础模型"]

[[items]]
title = "多语言语音与语言模型"
subtitle = "AI 算法工程师实习生 · 比亚迪"
date = "2026"
content = """
构建大规模多语言语音数据流程，训练用于 ASR、S2TT、Chat 与 SLU 的语音与语言模型。

- **语音合成：** 基于 CosyVoice3 完成 8 语种、单语种约 650 万条语音合成；支持多卡并行、流式输出与断点续跑。
- **Whisper 微调：** Whisper-large-v3 全参数微调，采用 DeepSpeed ZeRO Stage 2、BF16 与 SpecAug。
- **SLU：** Whisper Encoder + Adapter + Qwen3-8B，分阶段训练并结合 LoRA。
- **评测：** CER/WER 分级过滤，以及覆盖 ASR / S2TT / 通用能力的统一评测流程（COMET、LLM-as-a-Judge、MGSM、MMLU）。
"""
tags = ["ASR", "TTS", "大模型", "DeepSpeed"]
